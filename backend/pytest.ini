[pytest]
# Pytest configuration for Pet Health API
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async settings
asyncio_mode = auto

# Markers
markers =
    auth: Authentication related tests
    pets: Pet management tests  
    users: User management tests
    health: Health and general API tests
    slow: Slow running tests
    integration: Integration tests
    performance: Performance testing (load, baseline, stress tests)
    chaos: Chaos engineering and resilience tests
    ai: AI-specific functionality tests

# Test output
addopts = 
    --strict-markers
    --tb=short
    --show-capture=no
    -ra

# Minimum version
minversion = 7.0

# Disable warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::UserWarning:gzip
    ignore:.*gzip.*:UserWarning